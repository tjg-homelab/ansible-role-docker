---
# Docker apt repository and package settings
docker_apt_prereq_packages:
  - ca-certificates
  - curl
docker_apt_keyring_dir: /etc/apt/keyrings
docker_apt_keyring_file: /etc/apt/keyrings/docker.asc

# Docker's apt repo path follows the distribution name (ubuntu or debian).
# Derived automatically; override to pin a specific mirror or distro path.
docker_apt_repo_url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
docker_apt_repo_component: stable

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2
  - docker-doc
  - podman-docker
  - containerd
  - runc

# Service management
docker_manage_service: true
docker_service_name: docker
docker_service_enabled: true
docker_service_state: started
